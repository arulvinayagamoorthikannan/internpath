<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add or remove sample internship opportunities in the InternPath browser demo.">
  <title>Internship admin demo — InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-main"><div class="container">
    <header class="page-heading"><span class="eyebrow">Project demo tools</span><h1>Internship listings</h1><p>Add sample opportunities to the listings or remove ones you added. Changes are saved only in this browser.</p></header>
    <div class="prototype-banner">This is a front-end prototype, not a protected admin system. Do not enter private or real company data.</div>
    <div class="admin-layout">
      <section class="panel"><h2 style="margin-top:0;font:700 19px Manrope,sans-serif">Add an internship</h2>
        <form id="internship-form" class="form-stack">
          <div class="field"><label for="company">Company</label><input id="company" name="company" required maxlength="80"></div>
          <div class="field"><label for="role">Role title</label><input id="role" name="role" required maxlength="100"></div>
          <div class="field"><label for="category">Career area</label><select id="category" name="category" required><option value="">Choose an area</option><option>Technology</option><option>Design</option><option>Data</option><option>Marketing</option><option>Business</option></select></div>
          <div class="field"><label for="city">City or region</label><input id="city" name="city" required maxlength="80"></div>
          <div class="field"><label for="type">Work style</label><select id="type" name="type" required><option>Remote</option><option>Hybrid</option><option>On-site</option></select></div>
          <div class="field"><label for="duration">Duration</label><input id="duration" name="duration" placeholder="e.g. 12 weeks" required maxlength="50"></div>
          <div class="field"><label for="stipend">Stipend</label><input id="stipend" name="stipend" placeholder="e.g. ₹18,000 / month" required maxlength="60"></div>
          <div class="field"><label for="description">Description</label><textarea id="description" name="description" required maxlength="350"></textarea></div>
          <button class="button button-primary" type="submit">Add listing <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <section><h2 style="margin:0 0 12px;font:700 19px Manrope,sans-serif">Current listings</h2><div id="admin-list" class="admin-list"></div></section>
    </div>
  </div></main>
  <div id="site-footer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../js/main.js"></script><script type="module" src="../js/admin.js"></script>
</body>
</html>
